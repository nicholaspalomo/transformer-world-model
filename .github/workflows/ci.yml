name: CI & Build Tests

on:
  push:
    branches:
      - main
      - 'user/**'
  pull_request:
    branches:
      - main
      - '**'

jobs:
  build-and-test:
    name: Build Repo & Run Unit Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Graphics & Simulation Libraries
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libgl1-mesa-dri \
            libosmesa6-dev \
            libegl1-mesa \
            xvfb \
            ffmpeg

      - name: Install Bazel (Bazelisk)
        run: |
          sudo curl -fsSL https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Cache Bazel Artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Run Unit Tests
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p "*_test.py" -v

      - name: Test Milestone Scripts (Dry Run)
        run: |
          PYTHONPATH=. python scripts/01_collect_data.py --num_steps 20 --seq_len 10
          PYTHONPATH=. python scripts/02_train_model.py --num_steps 5 --batch_size 8
          PYTHONPATH=. python scripts/03_evaluate_mppi.py --num_samples 10 --horizon 5 --eval_steps 2
          PYTHONPATH=. python scripts/visualize_anymal.py --num_steps 5 --headless

  docker-build:
    name: Build Docker Container & Verify
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build Docker Development Image
        run: |
          docker compose build

      - name: Test Container Execution
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e DISPLAY=:1 \
            transformer-world-model-twm_dev \
            bash -c "PYTHONPATH=. python3 -m unittest discover -s tests -p '*_test.py' -v"
