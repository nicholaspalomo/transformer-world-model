# Pre-commit configuration for Transformer World Model (JAX/Flax)
repos:
  - repo: https://github.com/simonepri/ifttt-lint
    rev: v0.11.0
    hooks:
      - id: ifttt-lint
      - id: ifttt-lint-diff

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(html|stl|obj|png|jpg)$'
      - id: end-of-file-fixer
        exclude: '\.(html|stl|obj|png|jpg)$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=10000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: local
    hooks:
      - id: ifttt-and-format
        name: IFTTT Directive Validator & Code Formatter (make format)
        entry: tools/hooks/pre-commit
        language: script
        types_or: [python, shell, make, markdown, yaml]
        pass_filenames: false
