# Configuration for GRPO-style Diffusion Policy Training on ANYmal Quadruped Walking

env:
  env_name: "anymal_b"
  robot_model: "anybotics_anymal_b"
  xml_path: "assets/anybotics_anymal_b/scene.xml"
  backend: "positional"
  target_velocity: 0.8 # Target forward walking velocity in m/s
  n_frames: 4
  state_dim: 35 # Joint pos (12) + Joint vel (12) + Base height (1) + Quat (4) + LinVel (3) + AngVel (3)
  action_dim: 12 # 12 actuated joints: LF (3), RF (3), LH (3), RH (3)

pd_controller:
  kp: 50.0 # Proportional stiffness gain (N*m/rad)
  kd: 1.5 # Derivative damping gain (N*m*s/rad)
  tau_max: 40.0 # Motor torque limit (N*m)
  action_scale: 0.3 # Residual joint angle target scale (rad)

diffusion_policy:
  embed_dim: 256
  num_layers: 3
  time_embed_dim: 64
  num_timesteps: 8 # Number of reverse denoising steps K
  beta_start: 0.0001
  beta_end: 0.04

grpo:
  group_size: 8 # G candidate rollouts per state
  batch_size: 8 # B parallel environments
  rollout_horizon: 16 # Steps per rollout horizon H
  gamma: 0.99 # Discount factor
  clip_eps: 0.2 # PPO/GRPO clipping threshold
  beta_kl: 0.04 # KL penalty weight
  learning_rate: 0.0003 # AdamW learning rate
  weight_decay: 0.0001
  max_grad_norm: 1.0
  num_epochs: 4 # Optimization epochs per batch
  num_iterations: 50 # Total GRPO training iterations
  seed: 42
